[[inputs.snmp]]
  agents = ["${HPE_JH295A_SWITCH_SNMP_URL}"]
  agent_host_tag = "source"
  version = 3
  sec_name = "hpsnmp"
  sec_level = "authPriv"
  auth_protocol = "SHA"
  auth_password = "${HPE_JH295A_SWITCH_SNMP_AUTH}"
  priv_protocol = "AES256"
  priv_password = "${HPE_JH295A_SWITCH_SNMP_PRIV}"
  name = "switch"
  timeout = "10s"
  retries = 2

  # Systemname
  [[inputs.snmp.field]]
    name = "hostname"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  # Uptime (Timeticks -> Sekunden)
  [[inputs.snmp.field]]
    name = "uptime"
    oid = "1.3.6.1.2.1.1.3.0"
    conversion = "float(2)"

  # Interfaces: Status, Traffic (64 Bit), Fehler, Discards
  [[inputs.snmp.table]]
    name = "interfaces"
    inherit_tags = ["hostname"]

    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = "1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = "1.3.6.1.2.1.2.2.1.7"
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"
    [[inputs.snmp.table.field]]
      name = "ifHighSpeed"
      oid = "1.3.6.1.2.1.31.1.1.1.15"
    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.6"
    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.10"
    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "1.3.6.1.2.1.2.2.1.14"
    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "1.3.6.1.2.1.2.2.1.20"
    [[inputs.snmp.table.field]]
      name = "ifInDiscards"
      oid = "1.3.6.1.2.1.2.2.1.13"
    [[inputs.snmp.table.field]]
      name = "ifOutDiscards"
      oid = "1.3.6.1.2.1.2.2.1.19"

  # Hardware: CPU, Speicher, Temperatur, Status (H3C/HPE hh3cEntityExtStateTable)
  [[inputs.snmp.table]]
    name = "switch_hw"
    inherit_tags = ["hostname"]

    [[inputs.snmp.table.field]]
      name = "entName"
      oid = "1.3.6.1.2.1.47.1.1.1.1.7"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "cpu_percent"
      oid = "1.3.6.1.4.1.25506.2.6.1.1.1.1.6"
    [[inputs.snmp.table.field]]
      name = "mem_percent"
      oid = "1.3.6.1.4.1.25506.2.6.1.1.1.1.8"
    [[inputs.snmp.table.field]]
      name = "mem_size_bytes"
      oid = "1.3.6.1.4.1.25506.2.6.1.1.1.1.10"
    [[inputs.snmp.table.field]]
      name = "temperature"
      oid = "1.3.6.1.4.1.25506.2.6.1.1.1.1.12"
    [[inputs.snmp.table.field]]
      name = "temperature_threshold"
      oid = "1.3.6.1.4.1.25506.2.6.1.1.1.1.13"
    [[inputs.snmp.table.field]]
      name = "error_status"
      oid = "1.3.6.1.4.1.25506.2.6.1.1.1.1.19"

# InfluxDB-Output für Switch-Daten
[[outputs.influxdb_v2]]
  urls = ["${SWITCH_INFLUX_URL}"]
  token = "${SWITCH_INFLUX_TOKEN}"
  organization = "${SWITCH_INFLUX_ORGANIZATION}"
  bucket = "${SWITCH_INFLUX_BUCKET}"
  namepass = ["switch", "interfaces", "switch_hw"]
